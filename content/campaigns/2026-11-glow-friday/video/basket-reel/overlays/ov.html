<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}#s{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff}

</style></head><body><div id="s"></div><script>
const O={hook:'<div class="big dark" style="top:200px">GLOW<br>FRIDAY</div><div class="sub dark" style="top:540px;font-weight:400">سلّتك جاهزة؟</div>',
empty:'<div class="q dark">نعبّيها لك</div>',
