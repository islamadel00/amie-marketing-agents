<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
#s{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:'IBM Plex Sans Arabic';direction:rtl;background:linear-gradient(180deg,#E6DCD3 0%,#D9CCC1 100%)}
.logo{position:absolute;top:96px;left:50%;transform:translateX(-50%);width:190px}
.cap{position:absolute;top:215px;left:40px;right:40px;text-align:center;color:#3A2522;font-weight:500;font-size:62px;line-height:1.3;white-space:nowrap}
.win{position:absolute;left:110px;top:380px;width:860px;height:1290px;border-radius:36px;box-shadow:0 30px 70px rgba(58,37,34,.22)}
.tag{position:absolute;top:1700px;left:0;right:0;text-align:center;color:#5E2E21;font-size:34px;letter-spacing:6px;direction:ltr}
.mask{background:#000}#s.m{background:transparent}
.end{position:absolute;inset:0;background:#EAE1D8}
.end .img{position:absolute;left:-60px;top:-180px;width:1200px}
.end .logo{top:110px}
.end .t{position:absolute;top:1170px;left:0;right:0;text-align:center;color:#3A2522}
.end .badge{display:inline-block;border:2px solid #663C3C;color:#663C3C;font-size:34px;font-weight:500;padding:4px 28px 10px;border-radius:999px}
.end .n{font-size:80px;font-weight:600;line-height:1.2;margin-top:22px}
.end .c{font-size:38px;color:#5E2E21;margin-top:10px}
.end .p{margin-top:26px;font-size:100px;font-weight:600}.end .p small{font-size:46px;font-weight:500;margin-right:10px}
.end .btn{display:inline-block;margin-top:30px;background:#663C3C;color:#fff;font-size:56px;font-weight:600;padding:18px 90px 28px;border-radius:999px}
.end .u{margin-top:26px;font-size:36px;color:#5E2E21;direction:ltr;letter-spacing:2px}
</style></head><body><div id="s"></div><script>
const fr=c=>`<img class="logo" src="logo.png"><div class="cap">${c}</div><div class="win"></div><div class="tag">BODY GLOW · 120 ML</div>`;
const C={b1:fr('اللمعة اللي الكل بيسألك عنها'),b2:fr('ضغطة وحدة تكفي'),b3:fr('لمعة ناعمة من غير حبيبات'),b4:fr('وريحتها جوز هند وفانيليا'),
mask:'<div class="win mask" style="box-shadow:none"></div>',
end:`<div class="end"><img class="img" src="glow.jpg"><img class="logo" src="logo.png"><div class="t"><div class="badge">يباع سريعًا</div>
<div class="n">جل لمعة الجسم</div><div class="c">لمعة ناعمة بريحة جوز الهند والفانيليا</div><div class="p">176<small>ر.س</small></div>
<div class="btn">اطلبيها الحين</div><div class="u">amie-sa.com</div></div></div>`};
window.show=k=>{const s=document.getElementById('s');s.className=k==='mask'?'m':'';s.innerHTML=C[k]};
</script></body></html>
